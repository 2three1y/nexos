# Looscid OS — Cargo workspace root
#
# NexOS is the kernel; Looscid OS is the operating system layer that runs on
# top of it. The kernel is a freestanding no_std x86_64 binary booted by GRUB
# (Multiboot2); userland/ holds ring-3 programs that the kernel loads and runs.

[workspace]
resolver = "2"
members = ["kernel", "userland"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = false

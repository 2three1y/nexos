# NexOS kernel crate — the kernel of Looscid OS.
#
# Freestanding (no_std, no_main) x86_64 kernel, booted by GRUB via Multiboot2.
# The 32-bit entry stub (src/boot.rs) builds identity-mapped page tables,
# switches to 64-bit long mode and calls `kernel_main`.

[package]
name = "nexos-kernel"
description = "NexOS kernel — freestanding x86_64 kernel for Looscid OS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexos-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
x86_64 = "0.15"
pic8259 = "0.11"
pc-keyboard = "0.8"
uart_16550 = "0.3"
spin = "0.9"
linked_list_allocator = "0.10"
